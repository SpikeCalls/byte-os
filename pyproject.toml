[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "byteos"
version = "0.2.0"
description = "an operating system for a dog that wants things"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["dog", "terminal", "ascii", "good boy"]

[project.scripts]
byte = "byteos.cli:main"

[tool.setuptools]
packages = ["byteos"]

[tool.setuptools.package-data]
byteos = ["persona.json"]
